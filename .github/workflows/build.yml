name: build

# Solo configura, compila y ejecuta la suite. Los avisos del compilador son
# informativos de momento: subir ese liston es otra tarea.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      # El generador es opcional: con `generator: ''` no se pasa `-G` y CMake
      # elige el generador por defecto de la maquina. Es lo que necesita la
      # linea de Visual Studio, porque la version instalada en el runner cambia
      # con el tiempo (windows-latest ya no trae VS 2022) y fijar "Visual Studio
      # 17 2022" a mano rompe el trabajo en cuanto GitHub actualiza la imagen.
      CMAKE_GEN_ARG: ${{ matrix.generator && format('-G "{0}"', matrix.generator) || '' }}
    strategy:
      # Que un trabajo falle no debe ocultar el resultado de los demas: lo
      # interesante suele ser justo saber en cuantas plataformas falla.
      fail-fast: false
      matrix:
        include:
          - name: windows-x64-ninja
            os: windows-latest
            generator: Ninja
            arch: x64

          # Sin generador explicito: CMake escoge la version de Visual Studio
          # que haya instalada en la imagen del runner. Ver el comentario de
          # CMAKE_GEN_ARG mas arriba.
          - name: windows-x64-msbuild
            os: windows-latest
            generator: ''
            arch: x64
            multiconfig: true

          - name: linux-x64-gcc
            os: ubuntu-latest
            generator: Ninja
            arch: x64

          - name: linux-arm64-gcc
            os: ubuntu-24.04-arm
            generator: Ninja
            arch: arm64

          - name: macos-arm64
            os: macos-latest
            generator: Ninja
            arch: arm64

          # macos-13 (el ultimo runner Intel de la serie macos-NN) esta
          # retirado: los trabajos que lo piden se quedan en cola para siempre.
          # macos-15-intel es el runner x86_64 que lo sustituye.
          - name: macos-x64
            os: macos-15-intel
            generator: Ninja
            arch: x64

    steps:
      # NAP-027: @v4 declara `runs.using: node20` y GitHub lo estaba forzando
      # sobre Node 24 con un puente temporal, avisando en cada trabajo. @v5 es
      # ya node24 de verdad. v6 y v7 tambien lo son, asi que subir mas adelante
      # no vuelve a tocar este problema; se queda en v5 por ser el salto con
      # menos cambios de comportamiento respecto a v4.
      - uses: actions/checkout@v5

      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libcurl4-openssl-dev \
                                  libglu1-mesa-dev freeglut3-dev mesa-common-dev \
                                  libwebkit2gtk-4.1-dev

      - name: Dependencias de macOS
        if: runner.os == 'macOS'
        run: brew install ninja

      # NAP-027: aqui habia dos acciones de terceros, y las dos siguen en
      # node20 en su ultima version publicada (`gha-setup-ninja@v6`, de
      # 02/2025, e `ilammy/msvc-dev-cmd@v1.13.0`, de 01/2024). No hay a que
      # subirlas, asi que se sustituyen por lo que ya trae la imagen del
      # runner: choco para ninja y vcvarsall.bat para el entorno de MSVC.
      # Ahora la unica accion del workflow es `actions/checkout`, de GitHub.
      - name: Ninja en Windows
        if: runner.os == 'Windows' && matrix.generator == 'Ninja'
        run: choco install ninja -y --no-progress

      # Equivalente a lo que hacia msvc-dev-cmd: llamar a vcvarsall.bat y
      # propagar el entorno resultante a los pasos siguientes por GITHUB_ENV.
      # Se exportan solo las variables que CMake necesita para dar con cl.exe,
      # las cabeceras y las librerias; volcar `set` entero mete pseudovariables
      # de cmd (`=C:`, `=ExitCode`) que GITHUB_ENV no sabe leer.
      - name: Entorno MSVC
        if: runner.os == 'Windows' && matrix.generator == 'Ninja'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "no existe $vswhere" }
          $raiz = @(& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)[0]
          if (-not $raiz) { throw "vswhere no encuentra Visual Studio con las herramientas de C++" }
          $vcvarsall = Join-Path $raiz 'VC\Auxiliary\Build\vcvarsall.bat'
          if (-not (Test-Path $vcvarsall)) { throw "no existe $vcvarsall" }
          Write-Host "vcvarsall: $vcvarsall ${{ matrix.arch }}"
          $entorno = cmd /c "`"$vcvarsall`" ${{ matrix.arch }} >nul 2>&1 && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvarsall.bat salio con $LASTEXITCODE" }
          $exportar = @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VSINSTALLDIR', 'VCINSTALLDIR',
                        'VCToolsInstallDir', 'VCToolsVersion', 'WindowsSdkDir', 'WindowsSdkBinPath',
                        'WindowsSdkVerBinPath', 'WindowsSDKVersion', 'WindowsLibPath',
                        'UniversalCRTSdkDir', 'UCRTVersion', 'Platform', 'VisualStudioVersion')
          $puestas = 0
          foreach ($linea in $entorno) {
            $i = $linea.IndexOf('=')
            if ($i -lt 1) { continue }
            $nombre = $exportar | Where-Object { $_ -eq $linea.Substring(0, $i) } | Select-Object -First 1
            if ($nombre) {
              "$nombre=$($linea.Substring($i + 1))" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
              $puestas++
            }
          }
          Write-Host "$puestas variables exportadas a GITHUB_ENV"
          if ($puestas -lt 4) { throw "vcvarsall no dejo el entorno esperado" }

      # WebView queda activo, que es el valor por omision de NAPPGUI_WEB. Antes
      # habia que apagarlo porque el paquete exportado no arrastraba el loader
      # de WebView2 (CreateCoreWebView2EnvironmentWithOptions); ahora es un
      # requisito de uso de nappgui::osgui. Ver NAP-002.
      - name: Configure
        run: >
          cmake -S . -B build ${{ env.CMAKE_GEN_ARG }}
          -DCMAKE_BUILD_TYPE=Debug
          -DNAPPGUI_DEMO=YES
          -DNAPPGUI_TESTS=YES
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install

      - name: Build
        run: cmake --build build --config Debug

      - name: Tests
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: Install
        run: cmake --install build --config Debug

      # El consumidor externo es la prueba de que el paquete exportado sirve
      # para algo: compila contra el SDK instalado con find_package(), igual
      # que lo haria un usuario. Su CMakeLists ya no lleva parches: si vuelve a
      # necesitarlos, el paquete ha dejado de trasladar sus requisitos de uso.
      - name: Consumidor externo
        run: >
          cmake -S test/consumer -B build-consumer ${{ env.CMAKE_GEN_ARG }}
          -DCMAKE_BUILD_TYPE=Debug
          -Dnappgui_DIR=${{ github.workspace }}/install/cmake

      - name: Build del consumidor
        run: cmake --build build-consumer --config Debug

      # Las dos pruebas de consola se ejecutan; la de ventana no, porque los
      # runners no tienen sesion grafica.
      - name: Pruebas de regresion del consumidor
        shell: bash
        run: |
          set -e
          find build-consumer -name 'MacroHazards*' -type f -perm -u+x -exec {} \;
          find build-consumer -name 'Col2dPrecision*' -type f -perm -u+x -exec {} \;

  # Trabajo aparte: la configuracion menos ejercitada del proyecto.
  shared:
    name: linux-x64-shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5   # NAP-027, ver el comentario del otro trabajo

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libcurl4-openssl-dev \
                                  libglu1-mesa-dev freeglut3-dev mesa-common-dev \
                                  libwebkit2gtk-4.1-dev

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DNAPPGUI_SHARED=YES
          -DNAPPGUI_DEMO=YES
          -DNAPPGUI_TESTS=YES

      - name: Build
        run: cmake --build build

      - name: Tests
        run: ctest --test-dir build --output-on-failure
